name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Schluessel
        run: |
          if [ ! -f fixed.jks ]; then
            keytool -genkeypair -alias nogoguard -keyalg EC -groupname secp256r1 -validity 36500 -keystore fixed.jks -storetype PKCS12 -storepass android -keypass android -dname "CN=NoGoGuard"
            git config user.name github-actions
            git config user.email actions@github.com
            git add fixed.jks
            git commit -m "Schluessel"
            git push origin HEAD:main
          fi
      - name: Projekt erzeugen
        run: |
          mkdir -p .
          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "NoGoGuard"
          include(":app")
          EOF
          mkdir -p .
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          mkdir -p app
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.guard"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.guard"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 2
                  versionName = "2.0"
              }
              signingConfigs {
                  getByName("debug") {
                      storeFile = rootProject.file("fixed.jks")
                      storeType = "pkcs12"
                      storePassword = "android"
                      keyAlias = "nogoguard"
                      keyPassword = "android"
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <receiver android:name=".AdminReceiver"
                      android:permission="android.permission.BIND_DEVICE_ADMIN"
                      android:exported="true">
                      <meta-data android:name="android.app.device_admin" android:resource="@xml/device_admin"/>
                      <intent-filter>
                          <action android:name="android.app.action.DEVICE_ADMIN_ENABLED"/>
                      </intent-filter>
                  </receiver>
                  <service android:name=".GuardService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService"/>
                      </intent-filter>
                      <meta-data android:name="android.accessibilityservice" android:resource="@xml/a11y_config"/>
                  </service>
                  <service android:name=".DnsVpnService"
                      android:permission="android.permission.BIND_VPN_SERVICE"
                      android:exported="false">
                      <intent-filter>
                          <action android:name="android.net.VpnService"/>
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          EOF
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">NoGoGuard</string>
              <string name="a11y_desc">Blockiert 18+-Inhalte im Browser und schützt die App vor dem Entfernen.</string>
          </resources>
          EOF
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/colors.xml <<'EOF'
          <resources>
              <color name="ic_bg">#1E2A44</color>
          </resources>
          EOF
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_fg.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#00000000" android:strokeColor="#FFFFFF" android:strokeWidth="4"
                  android:pathData="M54,54m-26,0a26,26 0 1,0 52,0a26,26 0 1,0 -52,0"/>
              <path android:strokeColor="#FFFFFF" android:strokeWidth="3" android:strokeLineCap="round"
                  android:pathData="M54,30L54,33M78,54L75,54M54,78L54,75M30,54L33,54"/>
              <path android:strokeColor="#FFFFFF" android:strokeWidth="4" android:strokeLineCap="round"
                  android:pathData="M54,54L54,36M54,54L66,62"/>
              <path android:fillColor="#FF6B4A"
                  android:pathData="M54,54m-3.5,0a3.5,3.5 0 1,0 7,0a3.5,3.5 0 1,0 -7,0"/>
          </vector>
          EOF
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_bg"/>
              <foreground android:drawable="@drawable/ic_fg"/>
          </adaptive-icon>
          EOF
          mkdir -p app/src/main/res/xml
          cat > app/src/main/res/xml/device_admin.xml <<'EOF'
          <device-admin xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-policies><force-lock/></uses-policies>
          </device-admin>
          EOF
          mkdir -p app/src/main/res/xml
          cat > app/src/main/res/xml/a11y_config.xml <<'EOF'
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:description="@string/a11y_desc"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:canRetrieveWindowContent="true"
              android:notificationTimeout="300"/>
          EOF
          mkdir -p app/src/main/java/com/example/guard
          cat > app/src/main/java/com/example/guard/WordStore.kt <<'EOF'
          package com.example.guard

          import android.content.Context

          object WordStore {
              private val defaults = listOf(
                  "porn", "porno", "pornhub", "xxx", "nsfw", "hentai", "onlyfans", "xvideos",
                  "xhamster", "redtube", "youporn", "nackt", "nude", "nudes", "erotik", "camgirl", "sexcam"
              )

              private fun prefs(c: Context) = c.getSharedPreferences("guard", Context.MODE_PRIVATE)
              private fun custom(c: Context): Set<String> = prefs(c).getStringSet("custom", emptySet()) ?: emptySet()

              fun all(c: Context): Set<String> = defaults.toSet() + custom(c)
              fun customCount(c: Context) = custom(c).size

              fun add(c: Context, word: String): Boolean {
                  val w = word.trim().lowercase()
                  if (w.length < 4 || !w.all { it.isLetterOrDigit() }) return false
                  prefs(c).edit().putStringSet("custom", custom(c) + w).apply()
                  return true
              }

              private var cached: Pair<Int, Regex>? = null
              private fun rx(c: Context): Regex {
                  val w = all(c)
                  cached?.let { if (it.first == w.hashCode()) return it.second }
                  val r = Regex("(?<![\\p{L}\\p{N}])(" + w.joinToString("|") { Regex.escape(it) } + ")(?![\\p{L}\\p{N}])")
                  cached = w.hashCode() to r
                  return r
              }

              fun inText(c: Context, text: String) = rx(c).containsMatchIn(text.lowercase())
              fun inDomain(c: Context, d: String) = all(c).any { d.contains(it) }

              fun armed(c: Context) = prefs(c).getBoolean("armed", false)
              fun setArmed(c: Context) = prefs(c).edit().putBoolean("armed", true).apply()
          }
          EOF
          mkdir -p app/src/main/java/com/example/guard
          cat > app/src/main/java/com/example/guard/AdminReceiver.kt <<'EOF'
          package com.example.guard

          import android.app.admin.DeviceAdminReceiver
          import android.content.Context
          import android.content.Intent

          class AdminReceiver : DeviceAdminReceiver() {
              override fun onDisableRequested(context: Context, intent: Intent): CharSequence =
                  "Wenn du das deaktivierst, ist der Schutz weg."
          }
          EOF
          mkdir -p app/src/main/java/com/example/guard
          cat > app/src/main/java/com/example/guard/GuardService.kt <<'EOF'
          package com.example.guard

          import android.accessibilityservice.AccessibilityService
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo

          class GuardService : AccessibilityService() {

              private val browsers = setOf(
                  "com.android.chrome", "org.mozilla.firefox", "com.sec.android.app.sbrowser",
                  "com.brave.browser", "com.microsoft.emmx", "com.opera.browser",
                  "com.duckduckgo.mobile.android"
              )
              private val settingsPkgs = setOf(
                  "com.android.settings", "com.google.android.packageinstaller",
                  "com.android.packageinstaller", "com.google.android.permissioncontroller",
                  "com.samsung.android.packageinstaller", "com.android.vending"
              )
              private var pauseUntil = 0L
              private val kicks = ArrayDeque<Long>()

              override fun onAccessibilityEvent(e: AccessibilityEvent) {
                  val now = System.currentTimeMillis()
                  if (now < pauseUntil) return
                  val pkg = e.packageName?.toString() ?: return
                  if (pkg == packageName) return
                  val isBrowser = pkg in browsers
                  val isSettings = WordStore.armed(this) && pkg in settingsPkgs
                  if (!isBrowser && !isSettings) return
                  val root = rootInActiveWindow ?: return
                  val sb = StringBuilder()
                  collect(root, sb)
                  val text = sb.toString().lowercase()
                  val hit = if (isSettings) text.contains(getString(R.string.app_name).lowercase())
                            else WordStore.inText(this, text)
                  if (!hit) return
                  performGlobalAction(GLOBAL_ACTION_HOME)
                  if (isBrowser) {
                      pauseUntil = now + 4000
                      kicks.addLast(now)
                      while (kicks.isNotEmpty() && now - kicks.first() > 60000) kicks.removeFirst()
                      if (kicks.size >= 3) { pauseUntil = now + 120000; kicks.clear() }
                  }
              }

              private fun collect(n: AccessibilityNodeInfo?, sb: StringBuilder) {
                  if (n == null) return
                  n.text?.let { sb.append(it).append(' ') }
                  n.contentDescription?.let { sb.append(it).append(' ') }
                  for (i in 0 until n.childCount) collect(n.getChild(i), sb)
              }

              override fun onInterrupt() {}
          }
          EOF
          mkdir -p app/src/main/java/com/example/guard
          cat > app/src/main/java/com/example/guard/DnsVpnService.kt <<'EOF'
          package com.example.guard

          import android.content.Intent
          import android.net.VpnService
          import android.os.ParcelFileDescriptor
          import java.io.FileInputStream
          import java.io.FileOutputStream
          import java.net.DatagramPacket
          import java.net.DatagramSocket
          import java.net.InetAddress
          import java.util.concurrent.Executors

          class DnsVpnService : VpnService() {
              private var tun: ParcelFileDescriptor? = null
              @Volatile private var running = false
              private val pool = Executors.newFixedThreadPool(8)

              override fun onStartCommand(i: Intent?, f: Int, s: Int): Int {
                  if (tun == null) {
                      tun = Builder().setSession("NoGoGuard")
                          .addAddress("10.8.0.2", 32)
                          .addDnsServer("10.8.0.1")
                          .addRoute("10.8.0.1", 32)
                          .establish()
                      if (tun != null) {
                          running = true
                          Thread { loop() }.start()
                      }
                  }
                  return START_STICKY
              }

              override fun onDestroy() {
                  running = false
                  tun?.close()
                  tun = null
                  pool.shutdownNow()
              }

              private fun loop() {
                  val fd = tun ?: return
                  val inp = FileInputStream(fd.fileDescriptor)
                  val out = FileOutputStream(fd.fileDescriptor)
                  val buf = ByteArray(32767)
                  while (running) {
                      val n = try { inp.read(buf) } catch (e: Exception) { break }
                      if (n < 40) continue
                      if ((buf[0].toInt() shr 4) != 4 || buf[9].toInt() != 17) continue
                      val pkt = buf.copyOf(n)
                      pool.execute { handle(pkt, out) }
                  }
              }

              private fun handle(q: ByteArray, out: FileOutputStream) {
                  try {
                      val ihl = (q[0].toInt() and 15) * 4
                      val dns = q.copyOfRange(ihl + 8, q.size)
                      val name = qname(dns) ?: return
                      val reply = if (WordStore.inDomain(this, name)) nxdomain(dns) else forward(dns) ?: return
                      val p = build(q, ihl, reply)
                      synchronized(out) { out.write(p) }
                  } catch (e: Exception) {
                  }
              }

              private fun qend(d: ByteArray): Int {
                  var i = 12
                  while (i < d.size && d[i].toInt() != 0) i += (d[i].toInt() and 0xFF) + 1
                  return minOf(i + 5, d.size)
              }

              private fun qname(d: ByteArray): String? {
                  var i = 12
                  val sb = StringBuilder()
                  while (i < d.size && d[i].toInt() != 0) {
                      val l = d[i].toInt() and 0xFF
                      if (i + 1 + l > d.size) return null
                      sb.append(String(d, i + 1, l)).append('.')
                      i += l + 1
                  }
                  return sb.toString().trimEnd('.').lowercase()
              }

              private fun nxdomain(q: ByteArray): ByteArray {
                  val r = q.copyOf(qend(q))
                  r[2] = 0x81.toByte(); r[3] = 0x83.toByte()
                  for (i in 6..11) r[i] = 0
                  return r
              }

              private fun forward(q: ByteArray): ByteArray? = DatagramSocket().use { s ->
                  protect(s)
                  s.soTimeout = 3000
                  s.send(DatagramPacket(q, q.size, InetAddress.getByName("1.1.1.3"), 53))
                  val r = ByteArray(4096)
                  val p = DatagramPacket(r, r.size)
                  s.receive(p)
                  r.copyOf(p.length)
              }

              private fun build(q: ByteArray, ihl: Int, dns: ByteArray): ByteArray {
                  val total = 28 + dns.size
                  val o = ByteArray(total)
                  o[0] = 0x45; o[2] = (total shr 8).toByte(); o[3] = total.toByte(); o[8] = 64; o[9] = 17
                  System.arraycopy(q, 16, o, 12, 4)
                  System.arraycopy(q, 12, o, 16, 4)
                  var sum = 0
                  for (i in 0 until 20 step 2) sum += ((o[i].toInt() and 0xFF) shl 8) or (o[i + 1].toInt() and 0xFF)
                  while (sum shr 16 != 0) sum = (sum and 0xFFFF) + (sum shr 16)
                  val c = sum.inv() and 0xFFFF
                  o[10] = (c shr 8).toByte(); o[11] = c.toByte()
                  System.arraycopy(q, ihl + 2, o, 20, 2)
                  System.arraycopy(q, ihl, o, 22, 2)
                  val ul = 8 + dns.size
                  o[24] = (ul shr 8).toByte(); o[25] = ul.toByte()
                  System.arraycopy(dns, 0, o, 28, dns.size)
                  return o
              }
          }
          EOF
          mkdir -p app/src/main/java/com/example/guard
          cat > app/src/main/java/com/example/guard/MainActivity.kt <<'EOF'
          package com.example.guard

          import android.app.Activity
          import android.app.admin.DevicePolicyManager
          import android.content.ComponentName
          import android.content.Intent
          import android.net.VpnService
          import android.provider.Settings
          import android.widget.*

          class MainActivity : Activity() {

              private fun adminComp() = ComponentName(this, AdminReceiver::class.java)
              private fun adminActive() =
                  (getSystemService(DEVICE_POLICY_SERVICE) as DevicePolicyManager).isAdminActive(adminComp())
              private fun a11yOn() =
                  (Settings.Secure.getString(contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES) ?: "")
                      .contains(packageName)

              override fun onResume() {
                  super.onResume()
                  if (adminActive() && a11yOn()) WordStore.setArmed(this)
                  render()
              }

              private fun startVpn() {
                  val i = VpnService.prepare(this)
                  if (i != null) startActivityForResult(i, 1) else startService(Intent(this, DnsVpnService::class.java))
              }

              private fun render() {
                  val box = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(48, 96, 48, 48) }
                  fun tv(t: String) = box.addView(TextView(this).apply { text = t; textSize = 16f; setPadding(0, 16, 0, 8) })
                  fun btn(t: String, a: () -> Unit) = box.addView(Button(this).apply { text = t; setOnClickListener { a() } })

                  tv("NoGoGuard 2.0 - bitte in dieser Reihenfolge:")
                  tv("1. DNS-Filter")
                  btn("DNS-Filter starten") { startVpn() }
                  tv("2. Immer-an-VPN: Dort bei NoGoGuard das Zahnrad antippen und 'Immer aktives VPN' einschalten. 'Verbindungen ohne VPN blockieren' bleibt AUS.")
                  btn("VPN-Einstellungen öffnen") { startActivity(Intent(Settings.ACTION_VPN_SETTINGS)) }
                  tv("3. Geräteadmin: " + if (adminActive()) "aktiv ✅" else "aus ❌")
                  btn("Geräteadmin aktivieren") {
                      startActivity(Intent(DevicePolicyManager.ACTION_ADD_DEVICE_ADMIN)
                          .putExtra(DevicePolicyManager.EXTRA_DEVICE_ADMIN, adminComp()))
                  }
                  tv("4. Bedienungshilfe: " + if (a11yOn()) "aktiv ✅" else "aus ❌")
                  btn("Bedienungshilfe öffnen") { startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)) }
                  tv("Eigene Wörter: ${WordStore.customCount(this)} (mindestens 4 Zeichen; hinzufügen geht, entfernen nicht)")
                  val et = EditText(this).apply { hint = "Neues Wort" }
                  box.addView(et)
                  btn("Wort hinzufügen") {
                      if (WordStore.add(this, et.text.toString())) {
                          et.setText(""); render()
                      } else Toast.makeText(this, "Mindestens 4 Buchstaben oder Zahlen", Toast.LENGTH_SHORT).show()
                  }
                  setContentView(ScrollView(this).apply { addView(box) })
              }

              override fun onActivityResult(r: Int, res: Int, d: Intent?) {
                  if (r == 1 && res == RESULT_OK) startService(Intent(this, DnsVpnService::class.java))
              }
          }
          EOF
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: nogoguard-apk
          path: app/build/outputs/apk/debug/app-debug.apk
